name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar la carpeta publicada
        id: out
        run: |
          OUT="$(dirname "$(find dist -type f -name index.html | head -n 1)")"
          BASE="/${{ github.event.repository.name }}"
          cp "$OUT/index.html" "$OUT/404.html"
          find "$OUT" -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 perl -pi -e "s#([\"'(\`])/imgs/#\${1}${BASE}/imgs/#g"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.out.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5