<button
  class="radio-link"
  type="button"
  popovertarget="radio-panel"
  [attr.aria-label]="radio.playing() ? 'Radio sonando. Abrir controles' : 'Radio. Abrir controles'"
  (click)="radio.start()"
>
  <span #dot class="radio-indicator" [class.is-playing]="radio.playing()" aria-hidden="true"></span>
  <span>RADIO</span>
</button>
 
<div id="radio-panel" class="radio-panel" popover role="group" aria-label="Controles de radio">
  <p class="radio-label">{{ radio.playing() ? 'SONANDO AHORA' : radio.current() ? 'EN PAUSA' : 'RADIO' }}</p>
 
  <p class="radio-now" aria-live="polite">
    @if (radio.current(); as track) {
      <strong>{{ track.title }}</strong>
      <span>{{ track.artist }}</span>
    } @else {
      <span>Pulsa play para empezar</span>
    }
  </p>
 
  <div class="radio-controls">
    <button
      class="radio-play"
      type="button"
      [attr.aria-label]="radio.playing() ? 'Pausar' : 'Reproducir'"
      (click)="radio.toggle()"
    >
      @if (radio.playing()) {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z" />
        </svg>
      }
    </button>
 
    <button class="radio-next" type="button" aria-label="Siguiente canción" (click)="radio.next()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M6 6l9 6-9 6zM17 6h2v12h-2z" />
      </svg>
    </button>
  </div>
 
  <label class="radio-volume">
    <span>VOLUMEN</span>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="radio.volume()"
      [style.--v]="radio.volume() * 100 + '%'"
      (input)="onVolume($event)"
    />
  </label>
</div>
